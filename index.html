<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14407A">
<title>Asset Verify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14407A;--blue:#2563EB;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--bg:#EEF4FB;--card:#fff;
--ok:#047857;--okbg:#ECFDF5;--bad:#BE123C;--badbg:#FFF1F2;--warn:#B45309;--warnbg:#FFFBEB;--off:#475569;--offbg:#F1F5F9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Sarabun',system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:40px}
.hd{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 54px}
.hd h1{margin:0;font:700 20px 'Prompt',sans-serif}.hd small{display:block;opacity:.75;font-size:13px}
.srch{margin:-34px 14px 0;position:sticky;top:8px;z-index:5}
.srch input{width:100%;height:56px;border:2px solid #7DB5F0;border-radius:14px;padding:0 16px;font-size:16px;background:#fff;box-shadow:0 6px 18px rgba(20,64,122,.18)}
.stats{display:flex;gap:8px;margin:14px 14px 4px}
.stat{flex:1;background:var(--card);border-radius:12px;padding:8px 6px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font:700 20px 'Prompt'}.stat span{font-size:12px;color:var(--mut)}
.bar{margin:6px 14px 0;height:8px;border-radius:99px;background:#D6E2F2;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
h2{font:600 15px 'Prompt';margin:18px 16px 8px;color:var(--navy)}
.card{display:flex;gap:12px;align-items:center;width:calc(100% - 28px);margin:0 14px 10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.th{flex:0 0 64px;height:64px;border-radius:10px;background:var(--offbg) center/cover;display:grid;place-items:center;color:#94A3B8;font-size:11px}
.card .b{flex:1;min-width:0}.card b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span.s{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font:600 12px 'Prompt';margin-top:3px}
.pill.VERIFIED{background:var(--okbg);color:var(--ok)}.pill.NOT_FOUND{background:var(--badbg);color:var(--bad)}.pill.UNVERIFIED{background:var(--warnbg);color:var(--warn)}.pill.DISPOSED{background:var(--offbg);color:var(--off)}
.empty{text-align:center;color:var(--mut);padding:36px 16px}
#sheet .bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sh h3{margin:0;font:700 18px 'Prompt'}.sh p{margin:2px 0 0;color:var(--mut)}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}.kv div{display:flex;justify-content:space-between;gap:12px;padding:3px 0}.kv b{text-align:right}
.lab{font:600 14px 'Prompt';margin:14px 0 6px}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{min-height:52px;border:1px solid #CBD5E1;border-radius:12px;background:#fff;font:600 14px 'Prompt';color:#334155}
.seg.on.VERIFIED{background:var(--okbg);border-color:#10B981;color:var(--ok);box-shadow:inset 0 0 0 1px #10B981}
.seg.on.NOT_FOUND{background:var(--badbg);border-color:#F43F5E;color:var(--bad);box-shadow:inset 0 0 0 1px #F43F5E}
.seg.on.DISPOSED{background:var(--offbg);border-color:#64748B;color:var(--off);box-shadow:inset 0 0 0 1px #64748B}
.cam{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:12px;background:var(--navy);color:#fff;font:600 15px 'Prompt'}
.cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.prev{position:relative;margin-top:10px}.prev img{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.prev button{position:absolute;top:8px;right:8px;width:34px;height:34px;border:0;border-radius:10px;background:rgba(15,23,42,.75);color:#fff;font-size:16px}
.acts{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.btn{height:54px;border-radius:12px;border:1px solid var(--blue);background:var(--blue);color:#fff;font:700 15px 'Prompt'}
.btn.out{background:#fff;color:#334155;border-color:#CBD5E1}.btn[disabled]{opacity:.45}
#toast{position:fixed;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:532px;margin:0 auto}
.tt{background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-weight:600;box-shadow:0 10px 28px rgba(15,23,42,.25)}.tt.err{background:var(--bad)}
</style>
</head>
<body>
<div id="app">
  <div class="hd"><h1>สแกนทรัพย์สิน</h1><small>Asset Verify</small></div>
  <div class="srch"><input id="q" type="search" inputmode="search" autocomplete="off" placeholder="ค้นหาหรือพิมพ์รหัสทรัพย์สิน…"></div>
  <div id="stats"></div>
  <h2 id="ttl">รายการทรัพย์สินล่าสุด</h2>
  <div id="list"><div class="empty">กำลังโหลด…</div></div>
</div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
// >>> แก้ไข URL ของ Google Apps Script ที่ Deploy เสร็จแล้วที่นี่ <<<
const API_URL = "https://script.google.com/macros/s/AKfycbyHnCz6LONm1VnXoPuu9OrE4BfIRO_3khX_5mKjY-BnfCYfLg8Pr_B1jJzc1LDcG6bn/exec"; 

const S = { items: [], sel: null, status: 'VERIFIED', photo: null, rid: '', busy: false, q: '', seq: 0 };
const LABEL = { UNVERIFIED: 'ยังไม่ตรวจ', VERIFIED: 'ตรวจแล้ว', NOT_FOUND: 'ไม่พบ', DISPOSED: 'จำหน่ายแล้ว' };
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const cdn = (u, w) => String(u).indexOf('res.cloudinary.com') >= 0 ? String(u).replace('/upload/', '/upload/w_' + w + ',h_' + w + ',c_fill,q_auto,f_auto/') : '';

// ใช้งาน fetch() แทน google.script.run
async function rpc(action, payload = {}) {
  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, payload }),
      redirect: 'follow'
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const r = await response.json();
    if (r && r.ok) return r.data;
    throw new Error((r && r.error && r.error.message) || 'ไม่ทราบสาเหตุ');
  } catch (err) {
    throw new Error(err.message || 'การเชื่อมต่อขัดข้อง');
  }
}

function toast(msg, err) {
  const el = document.createElement('div'); el.className = 'tt' + (err ? ' err' : ''); el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), err ? 5200 : 2600);
}

function paintStats(s) {
  const done = s.total ? Math.round((s.total - s.UNVERIFIED) / s.total * 100) : 0;
  $('#stats').innerHTML = '<div class="stats">' +
    [['VERIFIED', 'ตรวจแล้ว'], ['UNVERIFIED', 'ยังไม่ตรวจ'], ['NOT_FOUND', 'ไม่พบ'], ['DISPOSED', 'จำหน่าย']]
      .map(x => '<div class="stat"><b>' + (s[x[0]] || 0) + '</b><span>' + x[1] + '</span></div>').join('') + '</div>' +
    '<div class="bar"><i style="width:' + done + '%"></i></div>';
}

function paintList() {
  $('#ttl').textContent = S.q ? 'ผลการค้นหา' : 'รายการทรัพย์สินล่าสุด';
  $('#list').innerHTML = S.items.length ? S.items.map(a => {
    const t = a.photo ? cdn(a.photo, 128) : '';
    return '<button class="card" data-uid="' + esc(a.uid) + '"><div class="th"' + (t ? ' style="background-image:url(' + esc(t) + ')"' : '') + '>' + (t ? '' : 'ไม่มีรูป') + '</div>' +
      '<div class="b"><b>' + esc(a.asset) + ': ' + esc(a.desc) + '</b><span class="s">' + esc(a.dept) + ' · ' + esc(a.loc) + '</span>' +
      '<span class="pill ' + esc(a.status) + '">' + esc(LABEL[a.status] || a.status) + '</span>' +
      (a.last ? '<span class="s">' + esc(a.last.slice(0, 16)) + '</span>' : '') + '</div></button>';
  }).join('') : '<div class="empty">ไม่พบทรัพย์สินที่ตรงกับ “' + esc(S.q) + '”</div>';
}

async function load() {
  const n = ++S.seq;
  try {
    const r = await rpc('search', { query: S.q });
    if (n !== S.seq) return; 
    S.items = r.items; paintStats(r.stats); paintList();
  } catch (e) { toast(e.message, true); $('#list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>'; }
}

let deb = null;
$('#q').addEventListener('input', e => { S.q = e.target.value.trim(); clearTimeout(deb); deb = setTimeout(load, 350); });
$('#list').addEventListener('click', e => { const c = e.target.closest('[data-uid]'); if (c) openSheet(c.dataset.uid); });

function openSheet(uid) {
  S.sel = S.items.find(a => a.uid === uid); if (!S.sel) return;
  S.status = 'VERIFIED'; S.photo = null; S.rid = uuid(); paintSheet();
}
function closeSheet() { S.sel = null; $('#sheet').innerHTML = ''; }
function canSave() { return !S.busy && (S.status !== 'VERIFIED' || !!S.photo); }

function paintSheet() {
  const a = S.sel;
  $('#sheet').innerHTML = '<div class="bg" data-x="bg"><div class="sh">' +
    '<h3>' + esc(a.asset) + '</h3><p>' + esc(a.desc) + '</p>' +
    '<div class="kv"><div><span>รหัส</span><b>' + esc(a.uid) + '</b></div><div><span>หน่วยงาน / ที่ตั้ง</span><b>' + esc(a.dept) + ' / ' + esc(a.loc) + '</b></div>' +
    '<div><span>สถานะปัจจุบัน</span><b>' + esc(LABEL[a.status] || a.status) + '</b></div>' + (a.last ? '<div><span>ตรวจล่าสุด</span><b>' + esc(a.last.slice(0, 16)) + '</b></div>' : '') + '</div>' +
    '<div class="lab">ผลการตรวจ</div><div class="segs">' +
    ['VERIFIED', 'NOT_FOUND', 'DISPOSED'].map(s => '<button class="seg ' + (S.status === s ? 'on ' + s : '') + '" data-st="' + s + '">' + LABEL[s] + '</button>').join('') + '</div>' +
    '<div class="lab">รูปถ่าย' + (S.status === 'VERIFIED' ? ' (บังคับ)' : ' (ไม่บังคับ)') + '</div>' +
    '<label class="cam">ถ่ายภาพ<input type="file" accept="image/*" capture="environment" id="file"></label>' +
    (S.photo ? '<div class="prev"><img src="' + S.photo.preview + '" alt="รูปที่ถ่าย"><button data-x="rm">✕</button></div>' : '') +
    '<div class="acts"><button class="btn out" data-x="close">ยกเลิก</button><button class="btn" data-x="save"' + (canSave() ? '' : ' disabled') + '>' + (S.busy ? 'กำลังบันทึก…' : 'บันทึก') + '</button></div>' +
    '</div></div>';
}

$('#sheet').addEventListener('click', e => {
  const st = e.target.closest('[data-st]'); if (st) { S.status = st.dataset.st; paintSheet(); return; }
  const x = e.target.closest('[data-x]'); if (!x) return;
  if (x.dataset.x === 'bg') { if (e.target === x && !S.busy) closeSheet(); }
  else if (x.dataset.x === 'close') { if (!S.busy) closeSheet(); }
  else if (x.dataset.x === 'rm') { S.photo = null; paintSheet(); }
  else if (x.dataset.x === 'save') save();
});

$('#sheet').addEventListener('change', async e => {
  if (e.target.id !== 'file' || !e.target.files[0]) return;
  try { S.photo = await compress(e.target.files[0], S.sel.uid + ' ' + stamp()); } catch (err) { toast(err.message, true); }
  paintSheet();
});

function stamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function compress(file, label) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const fs = Math.max(14, Math.round(c.width / 36)); x.font = '600 ' + fs + 'px sans-serif';
      x.fillStyle = 'rgba(15,23,42,.65)'; x.fillRect(0, c.height - fs - 1.9, x.measureText(label).width + fs, fs * 1.9);
      x.fillStyle = '#fff'; x.fillText(label, fs / 2, c.height - fs * 0.6);
      const d = c.toDataURL('image/jpeg', 0.72); resolve({ preview: d, data: d.split(',')[1] });
    };
    img.onerror = () => reject(new Error('อ่านรูปภาพไม่ได้')); img.src = url;
  });
}

async function save() {
  if (!canSave()) return; S.busy = true; paintSheet();
  try {
    const r = await rpc('submit', { requestId: S.rid, uid: S.sel.uid, status: S.status, photo: S.photo ? { data: S.photo.data } : null });
    toast(r.duplicate ? 'รายการนี้บันทึกไปแล้ว' : 'บันทึกแล้ว: ' + LABEL[r.status]);
    S.busy = false; closeSheet(); load();
  } catch (e) { S.busy = false; paintSheet(); toast(e.message, true); }
}

rpc('bootstrap').then(b => {
  S.items = b.items; paintStats(b.stats); paintList();
}).catch(e => { $('#list').innerHTML = '<div class="empty">โหลดระบบไม่สำเร็จ: ' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
