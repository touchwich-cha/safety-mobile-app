<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E40AF">
  <title>Safety Mobile App</title>
  <!-- UX Production v3 — Corporate Blue visual layer; routing/backend unchanged -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">
<style>
:root{
  --yellow:#FACC15;--yellow-dark:#EAB308;--ink:#111111;--text:#1A1C1A;--muted:#5F625F;
  --bg:#FAF9F5;--surface:#FFFFFF;--soft:#F1F1ED;--soft2:#E8E8E4;--line:#111111;
  --green:#15803D;--green-bg:#DCFCE7;--red:#BA1A1A;--red-bg:#FEE2E2;--orange:#D97706;--orange-bg:#FEF3C7;
  --blue:#0053DB;--blue-bg:#DBEAFE;--shadow:4px 4px 0 var(--ink);--shadow-sm:2px 2px 0 var(--ink);
  --bad:var(--red);--badbg:var(--red-bg);--badt:#7F1D1D;--ok:var(--green);--okbg:var(--green-bg);--okt:#166534;--warn:var(--orange);--warnbg:var(--orange-bg);--info:var(--blue);--infobg:var(--blue-bg);--mut:var(--muted);
  --sidebar:272px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.45}
body{overscroll-behavior:none}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:inherit}
#app{max-width:520px;margin:0 auto;padding:72px 14px 92px;min-height:100vh}
.boot{padding:72px 16px;text-align:center;color:var(--muted);font-weight:700}
.ms{width:1em;height:1em;overflow:hidden;font-family:'Material Symbols Outlined';font-weight:600;font-style:normal;font-size:23px;line-height:1;display:inline-block;vertical-align:middle;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.hd,h1,h2,h3{font-family:'Prompt','Sarabun',sans-serif;color:var(--ink);margin:0}
.mono,.d-val,.d-num,.d-pill,.badge{font-variant-numeric:tabular-nums}

/* Hazard / dry-run */
.dry{position:fixed;top:0;left:0;right:0;z-index:70;background:repeating-linear-gradient(45deg,var(--yellow),var(--yellow) 12px,var(--ink) 12px,var(--ink) 24px);padding:7px 10px;text-align:center;font-family:'Prompt',sans-serif;font-size:12px;font-weight:800;color:var(--ink);border-bottom:3px solid var(--ink)}
.dry::before{content:'DRY-RUN  ';background:#fff;border:2px solid var(--ink);padding:2px 6px;margin-right:6px;box-shadow:var(--shadow-sm)}

/* Topbar */
.top{display:flex;align-items:center;gap:10px;position:fixed;left:0;right:0;top:0;z-index:45;background:var(--surface);border-bottom:2.5px solid var(--ink);padding:9px 14px;min-height:62px}
body:has(.dry:not([hidden])) .top{top:34px}
.top .t{flex:1;min-width:0}.top .t h1{font-size:18px;line-height:1.15;font-weight:800}.top .t small{display:block;margin-top:2px;font-family:'Space Mono','Sarabun',monospace;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:40px;height:40px;background:var(--yellow);border:2.5px solid var(--ink);box-shadow:var(--shadow-sm);display:grid;place-items:center;color:var(--ink)}
.iconbtn{width:44px;height:44px;border:2px solid var(--ink);background:#fff;border-radius:4px;display:grid;place-items:center;color:var(--ink);box-shadow:var(--shadow-sm)}
.iconbtn:active,.btn:active,.menu:active,.chip:active,.seg:active,.tk:active,.d-mis:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* Generic layout */
.card{background:var(--surface);border:2.5px solid var(--ink);border-radius:4px;padding:15px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:11px;display:flex;align-items:center;gap:8px;font-weight:800}
.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;align-items:center}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Inputs */
input[type=text],input[type=number],input[type=date],input[type=month],textarea,select{width:100%;min-height:50px;border:2px solid var(--ink);border-radius:2px;padding:10px 12px;color:var(--ink);background:#fff;box-shadow:2px 2px 0 #D6D6D1}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus{box-shadow:3px 3px 0 var(--yellow);outline:none}
label.l{display:block;font-weight:800;font-size:13px;margin:14px 0 6px;color:var(--ink)}label.l i{color:var(--red);font-style:normal}

/* Department chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:5px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink);font:800 13px 'Prompt','Sarabun';box-shadow:var(--shadow-sm)}
.chip.on{background:var(--yellow);color:var(--ink)}
#deptCard{background:var(--soft)}#deptCard h2{border-bottom:2px solid var(--ink);padding-bottom:10px}

/* Menu cards */
.menu{display:block;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:3px;padding:14px;margin:12px 0;color:inherit;box-shadow:var(--shadow);position:relative}
.menu::after{content:'→';position:absolute;right:12px;top:12px;font:900 22px 'Prompt'}
.menu.red{background:var(--red);color:#fff}.menu.blue{background:var(--blue-bg)}.menu.dark{background:var(--ink);color:#fff}
.menu h3{font-size:16px;padding-right:30px}.menu.red h3,.menu.dark h3{color:#fff}.menu p{margin:6px 30px 0 0;font-size:12px;color:var(--muted)}.menu.red p,.menu.dark p{color:rgba(255,255,255,.8)}
.menu .eyebrow{font:800 10px 'Space Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.menu .ic{width:46px;height:46px;border:2px solid var(--ink);background:var(--yellow);display:grid;place-items:center}

/* Buttons */
.btn{display:flex;width:100%;min-height:54px;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);border-radius:3px;font:800 15px 'Prompt','Sarabun';background:var(--yellow);color:var(--ink);box-shadow:var(--shadow)}
.btn.dark{background:var(--ink);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.out{background:#fff;color:var(--ink)}.btn.sm{min-height:46px;font-size:13px}.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.seg{flex:1;min-height:52px;border:2px solid var(--ink);background:#fff;border-radius:2px;font:800 14px 'Prompt','Sarabun';color:var(--ink);padding:4px 8px;box-shadow:var(--shadow-sm)}
.seg.on.PASS{background:var(--green);color:#fff}.seg.on.FAIL{background:var(--red);color:#fff}.seg.on.sev0{background:var(--blue-bg);color:#003B9A}.seg.on.sev1{background:var(--orange);color:#fff}.seg.on.sev2{background:var(--red);color:#fff}.seg.on.plain{background:var(--ink);color:#fff}

/* Inspection items */
.item{padding:14px 0;border-top:2px solid var(--ink)}.item:first-of-type{border-top:0}.item .n{font:800 10px 'Space Mono',monospace;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}.item .q{font-weight:800;color:var(--ink);margin:4px 0 10px;font-size:15px}.item.bad{background:var(--red-bg);margin:0 -15px;padding:14px 15px;border-left:7px solid var(--red);border-top:2px solid var(--ink)}
.alert{background:var(--red-bg);border:2.5px solid var(--ink);border-left:8px solid var(--red);border-radius:2px;padding:12px;font-weight:800;margin:12px 0;box-shadow:var(--shadow-sm);color:#7F1D1D}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:2px solid var(--ink);border-radius:2px;font:800 10px 'Space Mono',monospace;background:var(--blue-bg);color:var(--ink);box-shadow:1px 1px 0 var(--ink)}
.badge.ok{background:var(--green-bg)}.badge.bad{background:var(--red-bg)}.badge.warn{background:var(--orange-bg)}

/* Photos */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ph{position:relative;width:80px;height:80px;border-radius:2px;overflow:hidden;border:2px solid var(--ink);box-shadow:var(--shadow-sm);background:var(--soft)}.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:3px;right:3px;width:28px;height:28px;border:2px solid var(--ink);background:var(--red);color:#fff;font-weight:900}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* Lists */
.list{border:2px solid var(--ink);max-height:300px;overflow:auto;background:#fff}.li{padding:11px;border-top:2px solid var(--ink);cursor:pointer}.li:first-child{border-top:0}.li:active,.li:hover{background:var(--yellow)}.li b{color:var(--ink)}.li small{display:block;color:var(--muted);margin-top:3px}.rec{display:flex;gap:10px;align-items:center;padding:11px;border:2px solid var(--ink);background:var(--green-bg);box-shadow:var(--shadow-sm)}.rec .b{flex:1;min-width:0}.rec b{display:block;color:var(--ink)}

/* Sticky actions */
.sticky{position:fixed;left:0;right:0;bottom:64px;background:var(--bg);border-top:2.5px solid var(--ink);padding:9px 14px calc(9px + env(safe-area-inset-bottom));z-index:35}
.sticky .in{max-width:520px;margin:0 auto;display:flex;gap:10px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2.5px solid var(--ink);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;border-right:2px solid var(--ink);background:#fff;min-height:62px;color:var(--muted);font:800 11px 'Prompt';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav button:last-child{border-right:0}.nav button.on{background:var(--yellow);color:var(--ink)}.nav button .ms{font-size:21px}.only-d,.nav-sep,.sos{display:none}

/* Modal & Toast */
#modal .bg{position:fixed;inset:0;background:rgba(17,17,17,.66);z-index:90;display:flex;align-items:flex-end;justify-content:center;padding-top:30px}
#modal .sheet{background:#fff;width:100%;max-width:520px;border:2.5px solid var(--ink);border-bottom:0;padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;box-shadow:0 -4px 0 var(--yellow)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;z-index:100;display:flex;flex-direction:column;gap:8px;width:calc(100% - 28px);max-width:480px;pointer-events:none}.tt{background:var(--ink);color:#fff;border:2px solid var(--ink);padding:11px 13px;font-weight:800;box-shadow:4px 4px 0 var(--yellow)}.tt.err{background:var(--red);box-shadow:4px 4px 0 var(--ink)}

/* Tickets & done */
.tk{border:2.5px solid var(--ink);border-left:8px solid var(--blue);padding:12px;margin:11px 0;background:#fff;box-shadow:var(--shadow);cursor:pointer}.tk.sev1{border-left-color:var(--orange)}.tk.sev2{border-left-color:var(--red)}
.done{text-align:center;padding:36px 4px}.done .big{width:82px;height:82px;margin:0 auto 16px;display:grid;place-items:center;background:var(--green-bg);border:3px solid var(--ink);box-shadow:var(--shadow);color:var(--green)}.done.fail .big{background:var(--red-bg);color:var(--red)}.done h2{font-size:22px}.kv{background:#fff;border:2.5px solid var(--ink);padding:12px;margin:16px 0;text-align:left;box-shadow:var(--shadow-sm)}.kv div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #999}.kv div:last-child{border-bottom:0}.kv b{color:var(--ink);text-align:right}.acc-h{display:flex;align-items:center;gap:8px;cursor:pointer}.acc-h .t{flex:1;font-weight:800;color:var(--ink)}

/* Dashboard */
.d-strip{display:grid;grid-template-columns:1fr 1fr;background:#fff;border:2.5px solid var(--ink);box-shadow:var(--shadow);margin:14px 0}.d-strip>div{padding:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}.d-strip>div:nth-child(2n){border-right:0}.d-strip>div:nth-last-child(-n+2){border-bottom:0}.d-lab{font:800 9px 'Space Mono',monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.d-val{margin-top:4px;font:800 13px 'Prompt';color:var(--ink)}.d-val.blue{color:var(--blue)}.d-dot{display:inline-block;width:9px;height:9px;background:var(--green);border:1px solid var(--ink);margin-right:6px}.d-dot.dry{background:var(--orange)}.d-lnk{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:2px;font-weight:800;cursor:pointer}
.d-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.d-card{background:#fff;border:2.5px solid var(--ink);padding:14px;box-shadow:var(--shadow)}.d-missions{grid-column:span 2;background:var(--soft)}.d-missions .d-sub{font:800 18px 'Prompt';border-bottom:3px solid var(--ink);padding:3px 0 10px;margin-bottom:10px}.d-mis{width:100%;min-height:72px;border:2.5px solid var(--ink);background:#fff;box-shadow:var(--shadow-sm);display:grid;grid-template-columns:48px 1fr 28px;align-items:center;gap:8px;padding:9px;margin:9px 0;text-align:left}.d-mis .ico{width:44px;height:44px;background:var(--yellow);border:2px solid var(--ink);display:grid;place-items:center}.d-mis.red .ico{background:var(--red);color:#fff}.d-mis.blue .ico{background:var(--blue);color:#fff}.d-mis.dark .ico{background:var(--ink);color:var(--yellow)}.d-mis .tx b{display:block;font:800 14px 'Prompt';color:var(--ink)}.d-mis .tx small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.d-num{font:900 36px 'Chivo','Prompt',sans-serif;line-height:1;color:var(--ink)}.d-num.sm{font-size:32px}.d-num.red{color:var(--red)}.d-unit{font-weight:800;color:var(--muted)}.d-note{font-size:12px;color:var(--muted);margin-top:9px}.d-edge,.d-bar{height:10px;border:2px solid var(--ink);background:var(--soft);margin-top:10px}.d-edge i,.d-bar i{display:block;height:100%;background:var(--yellow)}.d-bar.green i{background:var(--green)}.d-bar.red i{background:var(--red)}.d-rate{font:800 9px 'Space Mono',monospace;letter-spacing:.05em;margin-top:7px;color:var(--green)}.d-rate.red{color:var(--red)}.d-ringrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.d-tag{font:800 9px 'Space Mono',monospace;background:var(--green-bg);border:2px solid var(--ink);padding:2px 6px}.d-kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #999}.d-kv:last-child{border-bottom:0}.d-log{grid-column:span 2;padding:0;overflow:hidden}.d-logh{display:flex;flex-direction:column;gap:8px;padding:13px;border-bottom:2.5px solid var(--ink);background:var(--soft)}.d-logh h2{font-size:16px;display:flex;align-items:center;gap:7px}.d-sel{font:800 9px 'Space Mono',monospace;display:flex;align-items:center;gap:7px}.d-sel select{min-height:36px;width:auto;box-shadow:none;padding:5px 8px}.d-r{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border-bottom:2px solid var(--ink);align-items:center}.d-r:last-child{border-bottom:0}.d-r.bad{background:var(--red-bg)}.d-h{display:none}.d-ti b{display:block}.d-ti span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.d-pill{display:inline-block;border:2px solid var(--ink);padding:3px 7px;font:800 9px 'Space Mono',monospace;white-space:nowrap}.d-pill.ok{background:var(--green-bg)}.d-pill.bad{background:var(--red);color:#fff}.d-pill.warn{background:var(--orange-bg)}.d-pill.info{background:var(--blue-bg)}.dk{display:none}.d-empty{padding:30px;text-align:center;color:var(--muted)}


/* ===== Production v2: persistent desktop shell + balanced operational layouts ===== */
.desktop-only-nav{display:none}
.side-context{display:none}
.work-layout{display:block}.work-aside{display:none}
.op-rail{background:var(--ink);color:#fff;border:2.5px solid var(--ink);box-shadow:var(--shadow);padding:16px;position:sticky;top:92px}
.op-rail h3{color:#fff;font-size:17px;border-bottom:3px solid var(--yellow);padding-bottom:10px;margin-bottom:12px}.op-rail .rail-kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #777;font-size:13px}.op-rail .rail-kv:last-child{border-bottom:0}.op-rail .rail-kv span{color:#C9C9C3}.op-rail .rail-kv b{color:#fff;text-align:right}
.op-step{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;margin:10px 0}.op-step b{width:28px;height:28px;background:var(--yellow);color:var(--ink);border:2px solid #fff;display:grid;place-items:center;font:900 12px 'Space Mono',monospace}.op-step span{font-size:12px;color:#EFEFEA;padding-top:4px}
.d-metrics-zone{display:grid;grid-template-columns:1fr;gap:12px;grid-column:span 2}.d-matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px}.d-mini{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.d-mini .d-num{margin-top:14px}.metric-foot{font:800 9px 'Space Mono',monospace;letter-spacing:.04em;border:2px solid var(--ink);padding:5px 7px;background:var(--soft);margin-top:10px}.d-mini.ok .metric-foot{background:var(--green-bg)}.d-mini.bad .metric-foot{background:var(--red-bg)}.d-mini.warn .metric-foot{background:var(--orange-bg)}.d-mini.info .metric-foot{background:var(--blue-bg)}
.d-gauge{min-height:312px;display:flex;flex-direction:column}.d-gauge-wrap{flex:1;display:grid;place-items:center;position:relative;min-height:200px}.d-gauge svg{width:190px;height:190px}.d-gauge-center{position:absolute;text-align:center}.d-gauge-center b{display:block;font:900 36px 'Chivo','Prompt';line-height:1}.d-gauge-center span{font:800 9px 'Space Mono',monospace;letter-spacing:.08em;color:var(--muted)}
.d-system-strip{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2.5px solid var(--ink);background:#fff;box-shadow:var(--shadow);grid-column:span 2}.d-system-strip>div{padding:11px 13px;border-bottom:2px solid var(--ink)}.d-system-strip>div:nth-child(odd){border-right:2px solid var(--ink)}.d-system-strip>div:nth-last-child(-n+2){border-bottom:0}
.report-note{margin:0 0 14px;background:var(--blue-bg);border:2px solid var(--ink);box-shadow:var(--shadow-sm);padding:11px 13px;font-weight:700;color:var(--ink)}

@media (min-width:700px){
  #app{max-width:820px;padding-left:22px;padding-right:22px}.grid2.cats{grid-template-columns:repeat(2,1fr)}.forms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.forms .menu{margin:0}.tks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tks .tk{margin:0}
  #modal .bg{align-items:center;padding:30px}#modal .sheet{max-width:620px;border:2.5px solid var(--ink);box-shadow:8px 8px 0 var(--ink)}
  .d-strip{grid-template-columns:repeat(4,1fr)}.d-strip>div{border-bottom:0;border-right:2px solid var(--ink)}.d-strip>div:nth-child(2n){border-right:2px solid var(--ink)}.d-strip>div:last-child{border-right:0}
  .d-grid{grid-template-columns:repeat(4,1fr)}.d-missions{grid-column:span 4}.d-total{grid-column:span 2}.d-good,.d-rej{grid-column:span 1}.d-ring,.d-sys{grid-column:span 2}.d-log{grid-column:span 4}
}

@media (min-width:1024px){
  body{padding-left:var(--sidebar)}#app{max-width:1240px;padding:26px 32px 48px}.top{left:var(--sidebar);position:sticky;top:0;margin:-26px -32px 20px;padding:13px 32px;min-height:70px}.top .t h1{font-size:22px}.top .t small{font-size:10px}.dry{left:var(--sidebar)}body:has(.dry:not([hidden])) .top{top:34px}

/* ===== Production v3: Corporate Blue Visual Layer — UX/UI ONLY ===== */
:root{
  --primary:#1E40AF;
  --primary-hover:#1D4ED8;
  --primary-light:#EFF6FF;
  --primary-mid:#DBEAFE;
  --ink:#0F172A;
  --text:#0F172A;
  --muted:#64748B;
  --bg:#F8FAFC;
  --surface:#FFFFFF;
  --soft:#F8FAFC;
  --soft2:#F1F5F9;
  --line:#E2E8F0;
  --green:#10B981;
  --green-bg:#ECFDF5;
  --red:#EF4444;
  --red-bg:#FFF1F2;
  --orange:#F59E0B;
  --orange-bg:#FFFBEB;
  --blue:#2563EB;
  --blue-bg:#EFF6FF;
  --yellow:#2563EB;
  --yellow-dark:#1D4ED8;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --bad:var(--red);--badbg:var(--red-bg);--badt:#BE123C;
  --ok:var(--green);--okbg:var(--green-bg);--okt:#047857;
  --warn:var(--orange);--warnbg:var(--orange-bg);--info:var(--blue);--infobg:var(--blue-bg);--mut:var(--muted);
}
html,body{background:var(--bg);color:var(--text);font-family:'Inter','Prompt',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.hd,h1,h2,h3{font-family:'Plus Jakarta Sans','Prompt',sans-serif;color:var(--ink);letter-spacing:-.01em}
.mono,.d-val,.d-num,.d-pill,.badge,.d-lab,.metric-foot,.d-gauge-center span,.sc-meta,.sc-live{font-family:'IBM Plex Mono','Inter','Prompt',monospace}
button{transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .08s ease}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(37,99,235,.24);outline-offset:2px}
.iconbtn:active,.btn:active,.menu:active,.chip:active,.seg:active,.tk:active,.d-mis:active{transform:scale(.985);box-shadow:var(--shadow-sm)}

/* Dry-run status */
.dry{background:#FFFBEB;color:#92400E;border-bottom:1px solid #FDE68A;padding:7px 12px;font-family:'Inter','Prompt',sans-serif;font-size:11px;font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.dry::before{content:'DRY-RUN';display:inline-flex;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:999px;padding:2px 8px;margin-right:7px;box-shadow:none;font-weight:800;letter-spacing:.04em}

/* Topbar */
.top{background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px 14px;min-height:64px;box-shadow:0 1px 3px rgba(15,23,42,.04);backdrop-filter:blur(10px)}
.top .t h1{font-family:'Plus Jakarta Sans','Prompt',sans-serif;font-size:19px;font-weight:800;color:#0F172A}
.top .t small{font-family:'Inter','Prompt',sans-serif;font-size:10px;font-weight:700;letter-spacing:.08em;color:#94A3B8}
.logo{width:42px;height:42px;background:var(--primary);border:1px solid #BFDBFE;border-radius:12px;box-shadow:0 4px 10px rgba(30,64,175,.12);color:#fff}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:12px;color:#334155;box-shadow:var(--shadow-sm)}
.iconbtn:hover{background:#F8FAFC;border-color:#CBD5E1;color:var(--primary)}

/* Cards / generic content */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:750;margin-bottom:12px;color:#0F172A}
.muted{color:#64748B;font-size:13px}

/* Inputs */
input[type=text],input[type=number],input[type=date],input[type=month],textarea,select{min-height:50px;border:1px solid #CBD5E1;border-radius:11px;padding:10px 12px;color:#0F172A;background:#fff;box-shadow:none}

input:focus,textarea:focus,select:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12);outline:none}
label.l{font-weight:700;font-size:13px;margin:14px 0 7px;color:#334155}label.l i{color:#E11D48}

/* Department / filter chips */
.chips{gap:8px;padding:5px 2px 9px}
.chip{min-height:40px;padding:0 14px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;color:#475569;font:700 13px 'Inter','Prompt',sans-serif;box-shadow:none}

.btn.out{background:#fff;border-color:#CBD5E1;color:#334155;box-shadow:var(--shadow-sm)}.btn.out:hover{background:#F8FAFC;border-color:#94A3B8;color:#0F172A}

.seg.on.sev1{background:#FFFBEB;border-color:#FDE68A;color:#B45309;box-shadow:inset 0 0 0 1px #F59E0B}
.seg.on.sev2{background:#FFF1F2;border-color:#FECDD3;color:#BE123C;box-shadow:inset 0 0 0 1px #F43F5E}

/* Checklist */
.item{padding:15px 0;border-top:1px solid #E2E8F0}.item:first-of-type{border-top:0}.item .n{font:700 10px 'Inter','Prompt',sans-serif;color:#94A3B8;letter-spacing:.06em}.item .q{font-weight:700;color:#1E293B;margin:5px 0 10px;font-size:15px}.item.bad{background:#FFF7F8;margin:0 -17px;padding:15px 17px;border-left:4px solid #F43F5E;border-top:1px solid #FECDD3}

.photos{gap:9px}.ph{border-radius:12px;border:1px solid #CBD5E1;box-shadow:var(--shadow-sm);background:#F8FAFC}.ph button{top:4px;right:4px;width:27px;height:27px;border:0;border-radius:8px;background:#E11D48;color:#fff;box-shadow:0 2px 5px rgba(190,18,60,.18)}
.list{border:1px solid #E2E8F0;border-radius:12px;max-height:300px;overflow:auto;background:#fff}.li{padding:11px 12px;border-top:1px solid #E2E8F0}.li:first-child{border-top:0}.li:active,.li:hover{background:#EFF6FF}.li b{color:#1E293B}.li small{color:#64748B}.rec{padding:11px 12px;border:1px solid #A7F3D0;border-radius:12px;background:#ECFDF5;box-shadow:none}.rec b{color:#065F46}

<body>
  <div id="dry" class="dry" hidden>ระบบจะไม่บันทึกข้อมูลจริง</div>
  <div id="app"><div class="boot">กำลังโหลด…</div></div>
  <div id="modal"></div>
  <div id="toast"></div>
  <script>

/* ===== JsCore.html ===== */
/* JsCore — state, RPC, helpers, modal/toast, photo, shared components */
const S = {
  boot: null, view: 'home', stack: [], dept: '', deptQuery: '', name: '',
  form: null, quick: null, rep: null, audit: null, tk: { filter: '', list: null, loading: false }, done: null, busy: false
};
try { S.name = localStorage.getItem('ssm_name') || ''; S.dept = localStorage.getItem('ssm_dept') || ''; } catch (e) {}
function persist() { try { localStorage.setItem('ssm_name', S.name); localStorage.setItem('ssm_dept', S.dept); } catch (e) {} }

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = n => '<span class="ms">' + n + '</span>';
const cdn = (u, w) => String(u).indexOf('res.cloudinary.com') >= 0 ? String(u).replace('/upload/', '/upload/w_' + w + ',q_auto,f_auto/') : u;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

/* ---------- transport ----------
   Safari / iOS blocks google.script.run (sandboxed iframe + ITP third-party cookies),
   so every call is POSTed as JSON to this web app's own /exec URL instead.
   Content-Type stays text/plain so the browser sends no CORS preflight.
   Server side: doPost() in Backend.gs accepts {webapp:true, action, payload}.
   If fetch is unavailable or fails once, fall back to google.script.run. */
const API_URL = 'https://script.google.com/macros/s/AKfycbwGq48ueEERbtGYT553mZQCGBlXS4VpuLVhira03MuLUO258GpAG4-48gEhu96sx5-GHQ/exec';
let _fetchOk = null;   // null = unknown, true = fetch works, false = use google.script.run

function rpc(fn, arg) {
  const legacyOk = typeof google !== 'undefined' && google.script && google.script.run;
  // template tag not evaluated (served via createHtmlOutput) or fetch already failed -> legacy path
  if (_fetchOk === false || !API_URL || API_URL.indexOf('script.google.com') < 0) {
    return legacyOk ? rpcLegacy(fn, arg) : Promise.reject(new Error('API endpoint not found'));
  }
  const payload = (arg === undefined || arg === null) ? {} : arg;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ webapp: true, action: String(fn).replace(/^api_/, ''), payload: payload }),
    redirect: 'follow',
    credentials: 'omit'
  }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(txt => {
    let res; try { res = JSON.parse(txt); } catch (e) { throw new Error('BAD_JSON'); }
    if (res && res.ok) { _fetchOk = true; return res.data; }
    const err = new Error((res && res.error && res.error.message) || 'unknown error');
    const code = res && res.error && res.error.code;
    err.api = !(code === 'API_DISABLED' || code === 'NOT_FOUND');   // backend not redeployed yet -> allow legacy retry
    if (err.api) _fetchOk = true;   // transport is fine, the API rejected the request
    throw err;   // never retry a rejected request through google.script.run
  }).catch(err => {
    if (!err.api && _fetchOk !== true && legacyOk) { _fetchOk = false; return rpcLegacy(fn, arg); }
    throw err;
  });
}

function rpcLegacy(fn, arg) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => (r && r.ok) ? resolve(r.data) : reject(new Error(r && r.error ? r.error.message : 'ไม่ทราบสาเหตุ')))
      .withFailureHandler(e => reject(new Error((e && e.message) || String(e))))[fn](arg);
  });
}
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, v) {
  const ks = path.split('.'); let cur = o;
  ks.slice(0, -1).forEach(k => { if (cur[k] == null || typeof cur[k] !== 'object') cur[k] = {}; cur = cur[k]; });
  cur[ks[ks.length - 1]] = v;
}
function toast(msg, err) {
  const el = document.createElement('div'); el.className = 'tt' + (err ? ' err' : ''); el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), err ? 5200 : 2600);
}
function modal(html) { $('#modal').innerHTML = '<div class="bg" data-act="mclose-bg"><div class="sheet">' + html + '</div></div>'; }
function closeModal() { $('#modal').innerHTML = ''; }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ---------- navigation / render ---------- */
const VIEWS = {};
function go(view, replace) {
  if (!replace) S.stack.push(S.view);
  S.view = view; render(true);
}
function back() { S.view = S.stack.pop() || 'home'; render(true); }
function render(top) {
  const y = window.scrollY;
  document.body.dataset.view = S.view;
  $('#app').innerHTML = VIEWS[S.view]();
  $('#dry').hidden = !(S.boot && S.boot.dryRun);
  window.scrollTo(0, top ? 0 : y);
  if (typeof afterRender === 'function') afterRender();
}

/* ---------- photos ---------- */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const d = c.toDataURL('image/jpeg', 0.72); resolve({ preview: d, data: d.split(',')[1] });
    };
    img.onerror = () => reject(new Error('อ่านรูปภาพไม่ได้')); img.src = url;
  });
}
function photoBox(path, required) {
  const arr = getPath(S, path) || [];
  const thumbs = arr.map((p, i) => '<div class="ph"><img src="' + p.preview + '"><button data-act="rmphoto" data-path="' + path + '" data-i="' + i + '">✕</button></div>').join('');
  return '<div class="grid2" style="margin-top:8px">' +
    '<div class="btn dark sm filebtn">' + ic('photo_camera') + ' ถ่ายภาพ<input type="file" accept="image/*" capture="environment" data-photo="' + path + '"></div>' +
    '<div class="btn out sm filebtn">' + ic('add_photo_alternate') + ' เลือกรูป<input type="file" accept="image/*" multiple data-photo="' + path + '"></div></div>' +
    (arr.length ? '<div class="photos">' + thumbs + '</div>' : '') +
    '<div class="muted" style="margin-top:6px">' + (required ? '<b style="color:var(--bad)">บังคับ</b> ' : '') + 'แนบแล้ว ' + arr.length + '/5 รูป</div>';
}
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-photo]'); if (!el) return;
  const path = el.dataset.photo; const arr = getPath(S, path) || []; setPath(S, path, arr);
  for (const f of Array.from(el.files || [])) {
    if (arr.length >= 5) { toast('แนบได้สูงสุด 5 รูป', true); break; }
    try { arr.push(await compress(f)); } catch (err) { toast(err.message, true); }
  }
  el.value = ''; render();
});
const photosPayload = arr => (arr || []).map(p => ({ data: p.data }));

/* ---------- shared components ---------- */
function topbar(title, sub, showBack) {
  return '<div class="top">' + (showBack ? '<button class="iconbtn" data-act="back">' + ic('arrow_back') + '</button>' : '<div class="logo">' + ic('health_and_safety') + '</div>') +
    '<div class="t"><h1>' + esc(title) + '</h1><small>' + esc(sub || '') + '</small></div>' +
    '<button class="iconbtn" data-act="editname" title="ชื่อผู้ตรวจ">' + ic('person') + '</button></div>';
}
function deptChips() {
  const q = S.deptQuery.trim().toLowerCase();
  const list = S.boot.master.depts.filter(d => !q || d.code.toLowerCase().includes(q) || d.name.toLowerCase().includes(q));
  return list.map(d => '<button class="chip' + (S.dept === d.code ? ' on' : '') + '" data-act="dept" data-code="' + esc(d.code) + '">' + esc(d.code) + '</button>').join('') || '<span class="muted">ไม่พบหน่วยงาน</span>';
}
function deptPicker() {
  return '<div class="card" id="deptCard"><h2>' + ic('corporate_fare') + ' สถานที่ / หน่วยงาน <span class="muted" style="margin-left:auto">' + S.boot.master.depts.length + ' หน่วยงาน</span></h2>' +
    '<input type="text" placeholder="พิมพ์ค้นหา เช่น PD1, ENUT, QA…" value="' + esc(S.deptQuery) + '" data-model="deptQuery">' +
    '<div class="chips" id="deptChips">' + deptChips() + '</div></div>';
}
function bottomNav(active, desktopOnly) {
  const b = (v, i, l) => '<button class="' + (active === v ? 'on' : '') + '" data-act="nav" data-v="' + v + '">' + ic(i) + '<span>' + l + '</span></button>';
  const q = (k, i, l) => '<button class="only-d ' + (active === k ? 'on' : '') + '" data-act="menu" data-k="' + k + '">' + ic(i) + '<span>' + l + '</span></button>';
  const ctx = '<div class="side-context only-d"><div class="sc-top"><span class="sc-live">● ' + (S.boot && S.boot.dryRun ? 'DRY-RUN' : 'ONLINE') + '</span><span class="badge">' + esc(S.dept || '—') + '</span></div>' +
    '<div class="sc-name">' + esc(S.name || 'ยังไม่ได้ตั้งชื่อผู้ตรวจ') + '</div><div class="sc-meta">' + esc(S.boot ? S.boot.today : '') + ' · GAS WEBAPP</div></div>';
  return '<div class="nav' + (desktopOnly ? ' desktop-only-nav' : '') + '">' + ctx + '<div class="in">' + b('home', 'dashboard', 'ภาพรวม') + b('inspect', 'checklist', 'ตรวจ') + b('tickets', 'build_circle', 'Ticket') +
    '<div class="nav-sep only-d">QUICK ACCESS</div>' + q('audit', 'assignment_turned_in', 'ตรวจ คปอ.') + q('repair', 'home_repair_service', 'แจ้งซ่อม') + '</div>' +
    '<button class="sos only-d ' + (active === 'accident' ? 'on' : '') + '" data-act="menu" data-k="accident">' + ic('emergency') + '<span>แจ้งอุบัติเหตุ / Near Miss</span></button></div>';
}
function requireCtx() {
  if (!S.name) { promptName(); return false; }
  if (!S.dept) { toast('กรุณาเลือกหน่วยงานก่อน', true); const c = $('#deptCard'); if (c) c.scrollIntoView({ behavior: 'smooth' }); return false; }
  return true;
}
function promptName(after) {
  modal('<h2 class="hd" style="font-size:18px">ชื่อผู้ตรวจ / ผู้รายงาน</h2><p class="muted">ใช้บันทึกในรายงานทุกฉบับ (เก็บในเครื่องนี้)</p>' +
    '<input type="text" id="nameIn" maxlength="60" placeholder="ชื่อ-สกุล" value="' + esc(S.name) + '"><div style="height:12px"></div>' +
    '<button class="btn" data-act="savename">บันทึก</button>');
  window.__afterName = after || null;
}
function sevClass(sev) { const i = S.boot.master.lookups.SEVERITY.indexOf(sev); return i < 0 ? 0 : i; }
function sevButtons(path, cur) {
  return '<div class="row" style="gap:8px">' + S.boot.master.lookups.SEVERITY.map((s, i) =>
    '<button class="seg ' + (cur === s ? 'on sev' + i : '') + '" data-act="sev" data-path="' + path + '" data-val="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>';
}

/* ===== Js.Home.neo.html ===== */
/* JsHome — dashboard-style home (reads S.boot.stats / S.boot.recent only; no extra API calls) */
(function () {
  if (document.getElementById('plexmono')) return;
  const l = document.createElement('link'); l.id = 'plexmono'; l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap'; document.head.appendChild(l);
})();
const HOME_DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const HOME_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function homeDate() {
  const p = String(S.boot.today).split('-').map(Number), d = new Date(p[0], p[1] - 1, p[2]);
  return HOME_DAYS[d.getDay()] + ' ' + p[2] + ' ' + HOME_MON[p[1] - 1] + ' ' + (p[0] + 543);
}
function homeKind(t) {
  t = String(t);
  if (t.indexOf('อุบัติเหตุ') >= 0) return { l: 'อุบัติเหตุ', i: 'warning' };
  if (t.indexOf('แจ้งซ่อม') >= 0) return { l: 'แจ้งซ่อม', i: 'home_repair_service' };
  if (t.indexOf('คปอ') >= 0) return { l: 'ตรวจ คปอ.', i: 'assignment_turned_in' };
  return { l: 'ตรวจ', i: 'fact_check' };
}
function homePill(x) {
  if (x.kind === 'INSPECTION') return x.result === 'PASS' ? ['ok', 'ปกติ'] : ['bad', 'ไม่ปกติ'];
  const i = S.boot.master.lookups.SEVERITY.indexOf(x.result);
  return i === 2 ? ['bad', 'วิกฤต'] : i === 1 ? ['warn', 'กลาง'] : ['info', 'ต่ำ'];
}
function homeTime(t) { t = String(t); return t.slice(0, 10) === S.boot.today ? t.slice(11, 16) : t.slice(8, 10) + '/' + t.slice(5, 7) + ' ' + t.slice(11, 16); }
function homeLog() {
  let rows = S.boot.recent || [];
  if (S.homeFilter === 'ACT') rows = rows.filter(x => x.ticket || x.result === 'FAIL');
  const head = '<div class="d-r d-h"><div>เวลา</div><div>ประเภท</div><div>รายการ</div><div>หน่วยงาน</div><div>ระดับ</div><div>Ticket</div></div>';
  const body = rows.length ? rows.map(x => {
    const k = homeKind(x.title), p = homePill(x), t = homeTime(x.time);
    return '<div class="d-r' + (p[0] === 'bad' ? ' bad' : '') + '"><div class="dk mono">' + esc(t) + '</div><div class="dk">' + ic(k.i) + esc(k.l) + '</div>' +
      '<div class="d-ti"><b>' + esc(x.title) + '</b><span>' + esc(x.location) + '</span><span class="mb mono">' + esc(t) + ' · ' + esc(k.l) + ' · ' + esc(x.dept) + (x.ticket ? ' · ' + esc(x.ticket) : '') + '</span></div>' +
      '<div class="dk mono">' + esc(x.dept) + '</div><div class="d-pl"><span class="d-pill ' + p[0] + '">' + p[1] + '</span></div>' +
      '<div class="dk">' + (x.ticket ? '<a class="d-lnk" data-act="nav" data-v="tickets">' + esc(x.ticket) + '</a>' : '—') + '</div></div>';
  }).join('') : '<div class="d-empty">' + ic('inbox') + '<div>ยังไม่มีบันทึกที่ตรงเงื่อนไข</div></div>';
  return head + body;
}
VIEWS.home = () => {
  const st = S.boot.stats, m = S.boot.master, ins = st.inspectedToday, fail = st.failToday;
  const pass = Math.max(0, ins - fail), rate = ins ? Math.round(pass / ins * 100) : null;
  const abnormalRate = ins ? Math.round(fail / ins * 100) : null;
  const ringColor = rate == null ? '#D1D1CC' : rate >= 90 ? '#15803D' : rate >= 70 ? '#D97706' : '#BA1A1A';
  const last = (S.boot.recent || [])[0];
  const mission = (n, k, cls, title, sub) => '<button class="d-mis ' + cls + '" data-act="menu" data-k="' + k + '"><span class="ico"><b style="font:900 17px Chivo,Prompt">' + n + '</b></span><span class="tx"><b>' + title + '</b><small>' + sub + '</small></span>' + ic('arrow_forward') + '</button>';
  const metric = (label, value, unit, cls, foot, icon) => '<div class="d-card d-mini ' + (cls || '') + '"><div class="row sp"><div class="d-lab">' + label + '</div>' + ic(icon || 'analytics') + '</div><div><div class="row" style="align-items:baseline;gap:7px"><span class="d-num' + (cls === 'bad' ? ' red' : '') + '">' + value + '</span><span class="d-unit">' + unit + '</span></div><div class="metric-foot">' + foot + '</div></div></div>';

/* ---------- ISO form ---------- */
function newForm(code) {

function startForm(code) { if (!requireCtx()) return; S.form = newForm(code); go('form'); }
function failedItems(f) { return CK(f.code).filter(it => { const a = f.items[it.code]; return a && a.result && isFail(a.result); }); }
function itemRequired(L, it, header) {
  const cond = L.conditionalItems && L.conditionalItems[it.code];
  if (cond) { const v = header[cond]; return Array.isArray(v) ? v.length > 0 : !!v; }
  return !(L.optionalItems || []).includes(it.code);
}
function fieldHtml(fd) {

  if (fd.type === 'radio') return lab + '<div class="row wrap" style="gap:8px">' + S.boot.master.lookups[fd.list].map(o =>
    '<button class="seg plain ' + (v === o ? 'on' : '') + '" style="flex:1 1 45%" data-act="hdrpick" data-key="' + fd.key + '" data-val="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  if (fd.type === 'multi') return lab + '<div class="chips" style="flex-wrap:wrap;overflow:visible">' + S.boot.master.lookups[fd.list].map(o =>
    '<button class="chip' + ((v || []).includes(o) ? ' on' : '') + '" data-act="hdrmulti" data-key="' + fd.key + '" data-val="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>';
  return lab + '<input type="text" maxlength="120" data-model="form.header.' + fd.key + '" value="' + esc(v || '') + '">';
}
function assetListHtml() {

  if (a.error) return '<div class="li" style="color:var(--bad)">' + esc(a.error) + '</div>';
  if (!a.items.length) return '<div class="li muted">ไม่พบอุปกรณ์ในหน่วยงานนี้</div>';

    (a.limited ? '<div class="li muted">แสดง ' + a.items.length + ' จาก ' + a.total + ' รายการ — พิมพ์ค้นหาเพื่อกรอง</div>' : '');
}
function assetHtml(L) {
  const f = S.form;
  if (f.asset) {
    return '<div class="card"><h2>' + ic('inventory_2') + ' ข้อมูลอุปกรณ์</h2><div class="rec" style="background:var(--okbg)"><div class="b"><b>' + esc(f.asset.asset) + ' · ' + esc(f.asset.desc) + '</b><span class="muted">' + esc(f.asset.location) + '</span></div>' +
      '<button class="iconbtn" data-act="clearasset">' + ic('close') + '</button></div>' +
      (L.referenceImage && f.asset.photo ? '<a class="muted" href="' + esc(f.asset.photo) + '" target="_blank">ดูภาพอ้างอิงตำแหน่ง</a>' : '') + '</div>';

}
function itemHtml(L, it) {
  const f = S.form, a = f.items[it.code] || {}, fail = a.result && isFail(a.result), req = itemRequired(L, it, f.header);
  let body = '';
  if (it.type !== 'NUMBER') body += '<div class="row" style="gap:8px">' + it.options.map(o => {
    const g = S.boot.master.resultGroup[o] || 'PASS';
    return '<button class="seg ' + (a.result === o ? 'on ' + g : '') + '" data-act="pick" data-code="' + it.code + '" data-val="' + esc(o) + '">' + esc(o) + '</button>';
  }).join('') + '</div>';
  if (it.type === 'NUMBER' || it.type === 'NUMBER_OR_RADIO')
    body += '<input type="number" inputmode="decimal" min="0" style="margin-top:8px" placeholder="ระบุจำนวน/ค่าจริง" data-model="form.items.' + it.code + '.value" value="' + esc(a.value == null ? '' : a.value) + '">';
  if (fail && !L.causes) body += '<textarea style="margin-top:8px;min-height:64px" placeholder="รายละเอียดความผิดปกติ" data-model="form.items.' + it.code + '.detail">' + esc(a.detail || '') + '</textarea>';
  return '<div class="item' + (fail ? ' bad' : '') + '"><div class="n">ข้อ ' + it.seq + (req ? '' : ' · ไม่บังคับ') + '</div><div class="q">' + esc(it.label) + '</div>' + body + '</div>';
}

    (L.causes && fails.length ? '<div class="card"><h2>สาเหตุการชำรุด</h2>' + m.lookups.DEFECT_CAUSE.map(c =>
      '<button class="seg plain ' + (f.header.causes.includes(c) ? 'on' : '') + '" style="width:100%;margin:4px 0;text-align:left" data-act="cause" data-val="' + esc(c) + '">' + (f.header.causes.includes(c) ? '☑ ' : '☐ ') + esc(c) + '</button>').join('') +

    '<div class="card"><label class="l" style="margin-top:0">' + esc(L.remarkLabel || 'หมายเหตุ') + '</label><textarea maxlength="1000" data-model="form.remark">' + esc(f.remark) + '</textarea>' +
    '<label class="l">หลักฐานภาพถ่าย</label>' + photoBox('form.photos', fails.length > 0) + '</div>' +
    '<div class="sticky"><div class="in"><button class="btn out" style="flex:1" data-act="back">ยกเลิก</button><button class="btn" style="flex:2" data-act="formreview">' + ic('fact_check') + ' ตรวจสอบข้อมูล</button></div></div>' + bottomNav('inspect', true);
};
function validateForm() {
  const f = S.form, L = LAY(f.code);
  if (L.unit === 'ASSET' && L.assetRequired && !f.assetUid) return 'กรุณาเลือกอุปกรณ์';
  for (const fd of (L.fields || [])) {
    const v = f.header[fd.key];
    if (fd.required && (Array.isArray(v) ? !v.length : !String(v || '').trim())) return 'กรุณากรอก/เลือก: ' + fd.label;
  }
  for (const it of CK(f.code)) {
    const a = f.items[it.code] || {}, has = (a.result && a.result !== '') || (a.value !== undefined && a.value !== '' && a.value !== null);
    if (!has && itemRequired(L, it, f.header)) return 'ยังไม่ได้ตรวจ: ' + it.label;
    if (it.type === 'NUMBER' && has && Number(a.value) < 0) return 'ค่าตัวเลขไม่ถูกต้อง: ' + it.label;
  }
  const fails = failedItems(f).length;
  if (fails && f.photos.length < 1) return 'พบความผิดปกติ ต้องแนบรูปอย่างน้อย 1 รูป';
  if (L.causes && fails && !f.header.causes.length) return 'กรุณาเลือกสาเหตุการชำรุด';
  if (f.header.causes.includes('อื่นๆ') && !String(f.header.cause_other || '').trim()) return 'กรุณาระบุสาเหตุ "อื่นๆ"';
  return '';
}
function formReview() {
  const err = validateForm(); if (err) return toast(err, true);
  const f = S.form, n = CK(f.code).filter(it => f.items[it.code] && f.items[it.code].result).length, fails = failedItems(f).length;
  modal('<h2 class="hd" style="font-size:18px">ตรวจสอบก่อนบันทึก</h2><div class="kv"><div><span>ฟอร์ม</span><b>' + esc(f.code) + '</b></div><div><span>หน่วยงาน</span><b>' + esc(S.dept) + '</b></div>' +
    '<div><span>ข้อที่ตรวจ</span><b>' + n + '</b></div><div><span>ผิดปกติ</span><b style="color:' + (fails ? 'var(--bad)' : 'var(--okt)') + '">' + fails + '</b></div><div><span>รูปแนบ</span><b>' + f.photos.length + '</b></div></div>' +
    (fails ? '<div class="alert">ระบบจะเปิด Ticket แจ้งซ่อม/แก้ไขอัตโนมัติ (ตามตั้งค่าฟอร์ม)</div>' : '') +
    '<div class="grid2"><button class="btn out" data-act="mclose">แก้ไข</button><button class="btn" data-act="submitform">บันทึกข้อมูล</button></div>');
}
async function submitForm() {
  if (S.busy) return; S.busy = true; const f = S.form;
  modal('<div class="boot">กำลังบันทึก…</div>');
  try {
    const res = await rpc('api_submitInspection', { requestId: f.requestId, formCode: f.code, dept: S.dept, inspector: S.name, inspectDate: f.date,
      assetUid: f.assetUid, header: f.header, items: f.items, remark: f.remark, photos: photosPayload(f.photos) });
    closeModal(); S.done = { kind: 'inspection', res: res, title: meta(f.code).name }; S.form = null; S.stack = ['home']; go('done', true); refreshHome();
  } catch (e) { closeModal(); toast(e.message, true); } finally { S.busy = false; }
}

async function loadAssets() {
  const f = S.form; if (!f) return; const L = LAY(f.code); f.assets = { loading: true };
  try { f.assets = await rpc('api_assets', { dept: S.dept, categoryCode: L.category, query: f.assetQuery }); }
  catch (e) { f.assets = { error: e.message }; }
  const el = $('#assetList'); if (el) el.innerHTML = assetListHtml();
}
function afterRender() {
  if (S.view === 'form' && S.form && LAY(S.form.code).unit === 'ASSET' && !S.form.asset && S.form.assets === null) loadAssets();
}

/* ===== JsReport.html ===== */
/* JsReport — Menu 2 (accident), Menu 3 (repair), Menu 4 (คปอ. audit), done screen */
const REP = {
  accident: { type: 'ACCIDENT', title: 'อุบัติเหตุ / Near Miss', sub: 'Fast Incident Alert', ph: 'อธิบายเหตุการณ์ สถานที่ และสิ่งที่ดำเนินการแล้ว' },
  repair: { type: 'REPAIR', title: 'แจ้งซ่อม / ชำรุด', sub: 'Maintenance Ticket', ph: 'ระบุอุปกรณ์ที่เสียหาย/ชำรุด และอาการ' }
};
function startReport(kind) { if (!requireCtx()) return; S.rep = { kind: kind, requestId: uuid(), severity: '', remark: '', photos: [] }; go('report'); }
VIEWS.report = () => {
  const r = S.rep, c = REP[r.kind], active = r.kind === 'repair' ? 'repair' : 'accident';
  const photoN = (r.photos || []).length;
  const main = '<div class="work-main"><div class="card"><div class="row sp" style="border-bottom:3px solid #111;padding-bottom:11px;margin-bottom:12px"><span class="badge">' + esc(S.dept) + '</span><span class="d-lab">' + esc(c.type) + '</span></div><label class="l">ระดับความรุนแรง<i> *</i></label>' + sevButtons('rep.severity', r.severity) + '<label class="l">หมายเหตุ / รายละเอียด<i> *</i></label><textarea maxlength="1000" placeholder="' + esc(c.ph) + '" data-model="rep.remark">' + esc(r.remark) + '</textarea><label class="l">ภาพถ่ายประกอบ</label>' + photoBox('rep.photos', false) + '</div>' + (r.kind === 'repair' ? '<div class="report-note">' + ic('build_circle') + ' ระบบจะเปิด Ticket งานซ่อมให้อัตโนมัติเมื่อบันทึก</div>' : '') + '</div>';
  const rail = '<aside class="work-aside"><div class="op-rail"><h3>' + (r.kind === 'repair' ? 'MAINTENANCE FLOW' : 'INCIDENT FLOW') + '</h3><div class="rail-kv"><span>ผู้รายงาน</span><b>' + esc(S.name) + '</b></div><div class="rail-kv"><span>หน่วยงาน</span><b>' + esc(S.dept) + '</b></div><div class="rail-kv"><span>ระดับ</span><b>' + esc(r.severity || 'ยังไม่เลือก') + '</b></div><div class="rail-kv"><span>รูปแนบ</span><b>' + photoN + '/5</b></div><div style="height:10px"></div><div class="op-step"><b>1</b><span>เลือกระดับความรุนแรง</span></div><div class="op-step"><b>2</b><span>ระบุรายละเอียดเหตุการณ์หรืออาการ</span></div><div class="op-step"><b>3</b><span>แนบภาพถ่ายประกอบเมื่อมี</span></div><div class="op-step"><b>4</b><span>ตรวจสอบและบันทึกข้อมูล</span></div></div></aside>';
  return topbar(c.title, c.sub, true) + '<div class="work-layout">' + main + rail + '</div><div class="sticky"><div class="in"><button class="btn out" style="flex:1" data-act="back">ยกเลิก</button><button class="btn ' + (r.severity === S.boot.master.lookups.SEVERITY[2] ? 'red' : '') + '" style="flex:2" data-act="repreview">บันทึก</button></div></div>' + bottomNav(active, true);
};
function repReview() {
  const r = S.rep;
  if (!r.severity) return toast('กรุณาเลือกระดับความรุนแรง', true);
  if (!r.remark.trim()) return toast('กรุณากรอกหมายเหตุ', true);
  if (r.severity === S.boot.master.lookups.SEVERITY[2])
    modal('<div class="alert">' + ic('emergency') + ' ระดับ "' + esc(r.severity) + '"</div><p>ยืนยันการแจ้งเหตุระดับสูงสุดของหน่วยงาน <b>' + esc(S.dept) + '</b> ?</p><div class="grid2"><button class="btn out" data-act="mclose">ยกเลิก</button><button class="btn red" data-act="repsubmit">ยืนยันส่งรายงาน</button></div>');
  else submitRep();
}
async function submitRep() {
  const r = S.rep; if (S.busy) return; S.busy = true; modal('<div class="boot">กำลังบันทึก…</div>');
  try {
    const res = await rpc('api_submitReport', { requestId: r.requestId, type: REP[r.kind].type, dept: S.dept, severity: r.severity, remark: r.remark, reporter: S.name, photos: photosPayload(r.photos) });
    closeModal(); S.done = { kind: 'report', res: res, title: REP[r.kind].title }; S.rep = null; S.stack = ['home']; go('done', true); refreshHome();
  } catch (e) { closeModal(); toast(e.message, true); } finally { S.busy = false; }
}

/* ---------- Audit (คปอ.) ---------- */
function startAudit() { if (!requireCtx()) return; S.audit = { requestId: uuid(), date: today(), items: [{ severity: '', remark: '', photos: [], open: true }] }; go('audit'); }
VIEWS.audit = () => {
  const a = S.audit, max = 20;
  const photos = a.items.reduce((n, x) => n + (x.photos || []).length, 0);
  const itemCards = a.items.map((x, i) => '<div class="card"><div class="acc-h" data-act="audittoggle" data-i="' + i + '"><span class="t">รายการที่ ' + (i + 1) + (x.severity ? ' · ' + esc(x.severity) : '') + '</span>' + (a.items.length > 1 ? '<button class="iconbtn" data-act="auditdel" data-i="' + i + '">' + ic('delete') + '</button>' : '') + ic(x.open ? 'expand_less' : 'expand_more') + '</div>' + (x.open ? '<label class="l">ระดับความรุนแรง<i> *</i></label>' + sevButtons('audit.items.' + i + '.severity', x.severity) + '<label class="l">บันทึกข้อบกพร่อง / การดำเนินการทันที<i> *</i></label><textarea maxlength="1000" data-model="audit.items.' + i + '.remark">' + esc(x.remark) + '</textarea><label class="l">รูปถ่ายหน้างาน</label>' + photoBox('audit.items.' + i + '.photos', false) : '') + '</div>').join('');
  const main = '<div class="work-main"><div class="card"><div class="row sp" style="border-bottom:3px solid #111;padding-bottom:10px;margin-bottom:10px"><span class="badge">' + esc(S.dept) + '</span><span class="d-lab">MONTHLY AUDIT</span></div><label class="l">วันที่ทำการตรวจ</label><input type="date" data-model="audit.date" value="' + esc(a.date) + '"></div><div class="row sp" style="padding:2px 4px 0"><h2 class="hd" style="font-size:18px">รายการข้อบกพร่องที่พบ</h2><span class="badge">' + a.items.length + '/' + max + '</span></div>' + itemCards + (a.items.length < max ? '<button class="btn out" data-act="auditadd">' + ic('add_circle') + ' เพิ่มรายการตรวจ</button>' : '') + '</div>';
  const rail = '<aside class="work-aside"><div class="op-rail"><h3>MONTHLY AUDIT</h3><div class="rail-kv"><span>ผู้ตรวจ</span><b>' + esc(S.name) + '</b></div><div class="rail-kv"><span>หน่วยงาน</span><b>' + esc(S.dept) + '</b></div><div class="rail-kv"><span>วันที่ตรวจ</span><b>' + esc(a.date) + '</b></div><div class="rail-kv"><span>รายการ</span><b>' + a.items.length + '/' + max + '</b></div><div class="rail-kv"><span>รูปแนบ</span><b>' + photos + '</b></div><div style="height:10px"></div><div class="op-step"><b>1</b><span>เพิ่มข้อบกพร่องที่พบ</span></div><div class="op-step"><b>2</b><span>กำหนดระดับความรุนแรงทุกข้อ</span></div><div class="op-step"><b>3</b><span>บันทึกการดำเนินการทันที</span></div><div class="op-step"><b>4</b><span>ตรวจสอบสรุปก่อนบันทึก</span></div></div></aside>';
  return topbar('ตรวจประจำเดือน คปอ.', 'Monthly Audit', true) + '<div class="work-layout">' + main + rail + '</div><div class="sticky"><div class="in"><button class="btn out" style="flex:1" data-act="back">ยกเลิก</button><button class="btn" style="flex:2" data-act="auditreview">' + ic('check_circle') + ' บันทึกข้อมูล</button></div></div>' + bottomNav('audit', true);
};
function auditReview() {
  const a = S.audit;
  for (let i = 0; i < a.items.length; i++) {
    if (!a.items[i].severity) return toast('รายการที่ ' + (i + 1) + ': กรุณาเลือกระดับความรุนแรง', true);
    if (!a.items[i].remark.trim()) return toast('รายการที่ ' + (i + 1) + ': กรุณากรอกหมายเหตุ', true);
  }
  const sev = S.boot.master.lookups.SEVERITY, top = a.items.reduce((m, x) => Math.max(m, sev.indexOf(x.severity)), 0), photos = a.items.reduce((n, x) => n + x.photos.length, 0);
  modal('<h2 class="hd" style="font-size:18px">ตรวจสอบก่อนบันทึก</h2><div class="kv"><div><span>หน่วยงาน</span><b>' + esc(S.dept) + '</b></div><div><span>จำนวนรายการ</span><b>' + a.items.length + '</b></div>' +
    '<div><span>ความรุนแรงสูงสุด</span><b>' + esc(sev[top]) + '</b></div><div><span>รูปแนบทั้งหมด</span><b>' + photos + '</b></div></div>' +
    '<div class="grid2"><button class="btn out" data-act="mclose">แก้ไข</button><button class="btn ' + (top === 2 ? 'red' : '') + '" data-act="auditsubmit">บันทึก</button></div>');
}
async function submitAudit() {
  const a = S.audit; if (S.busy) return; S.busy = true; modal('<div class="boot">กำลังบันทึก…</div>');
  try {
    const res = await rpc('api_submitAudit', { requestId: a.requestId, dept: S.dept, auditor: S.name, auditDate: a.date,
      items: a.items.map(x => ({ severity: x.severity, remark: x.remark, photos: photosPayload(x.photos) })) });
    closeModal(); S.done = { kind: 'audit', res: res, title: 'ตรวจประจำเดือน คปอ.' }; S.audit = null; S.stack = ['home']; go('done', true); refreshHome();
  } catch (e) { closeModal(); toast(e.message, true); } finally { S.busy = false; }
}

/* ---------- Done ---------- */
VIEWS.done = () => {
  const d = S.done, r = d.res, bad = r.overall === 'FAIL';
  const kv = [];
  if (r.dryRun) kv.push(['โหมด', 'DRY-RUN (ไม่ได้บันทึกจริง)']);
  if (r.duplicate) kv.push(['หมายเหตุ', 'รายการนี้เคยบันทึกแล้ว (ไม่สร้างซ้ำ)']);
  if (r.logId) kv.push(['รหัสอ้างอิง', r.logId]);
  if (r.reportId) kv.push(['รหัสอ้างอิง', r.reportId]);
  if (r.batchId) kv.push(['รหัสอ้างอิง', r.batchId], ['จำนวนรายการ', r.count]);
  if (r.ticketId) kv.push(['Ticket', r.ticketId]);
  if (r.overall) kv.push(['ผลการตรวจ', bad ? 'ไม่ปกติ ' + r.failCount + ' รายการ' : 'ปกติ']);
  if (r.photoCount != null) kv.push(['รูปแนบ', r.photoCount]);
  return '<div class="done' + (bad ? ' fail' : '') + '"><div class="big">' + ic(bad ? 'report_problem' : 'done_all') + '</div><h2>บันทึกข้อมูลเรียบร้อยแล้ว</h2><p class="muted">' + esc(d.title) + '</p>' +
    '<div class="kv">' + kv.map(x => '<div><span>' + esc(x[0]) + '</span><b>' + esc(x[1]) + '</b></div>').join('') + '</div>' +
    '<div class="grid2"><button class="btn out" data-act="nav" data-v="home">กลับหน้าหลัก</button><button class="btn" data-act="nav" data-v="inspect">ตรวจรายการใหม่</button></div></div>' + bottomNav('home', true);
};

/* ===== Js.Tickets.html ===== */
/* JsTickets — list + status update */
async function loadTickets() {
  S.tk.loading = true; render();
  try { S.tk.list = await rpc('api_tickets', ''); } catch (e) { toast(e.message, true); S.tk.list = []; }
  S.tk.loading = false; render();
}
VIEWS.tickets = () => {
  const st = S.boot.master.lookups.TICKET_STATUS, list = (S.tk.list || []).filter(t => !S.tk.filter || t.status === S.tk.filter);
  return topbar('Ticket งานซ่อม', 'Maintenance Tickets') +
    '<div class="chips"><button class="chip' + (!S.tk.filter ? ' on' : '') + '" data-act="tkfilter" data-val="">ทั้งหมด</button>' +
    st.map(s => '<button class="chip' + (S.tk.filter === s ? ' on' : '') + '" data-act="tkfilter" data-val="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    (S.tk.loading ? '<div class="boot">กำลังโหลด…</div>' : (list.length ? '<div class="tks">' + list.map(t =>
      '<div class="tk sev' + sevClass(t.severity) + '" data-act="tkopen" data-id="' + esc(t.id) + '"><div class="row sp"><b class="hd">' + esc(t.id) + '</b><span class="badge ' + (t.status === 'ปิด' ? 'ok' : '') + '">' + esc(t.status) + '</span></div>' +
      '<div style="margin:6px 0">' + esc(t.description) + '</div><div class="muted">' + esc(t.dept) + ' · ' + esc(t.severity) + ' · ' + esc(String(t.createdAt).slice(0, 16)) + (t.assignedTo ? ' · ' + esc(t.assignedTo) : '') + '</div></div>').join('') + '</div>' : '<div class="boot">ไม่มี Ticket</div>')) +
    bottomNav('tickets');
};
function openTicket(id) {
  const t = (S.tk.list || []).find(x => x.id === id); if (!t) return;
  S.tk.edit = { id: id, status: t.status, assignedTo: t.assignedTo || '', note: t.closeNote || '' };
  paintTicketSheet();
}
function paintTicketSheet() {
  const e = S.tk.edit, t = S.tk.list.find(x => x.id === e.id);
  modal('<h2 class="hd" style="font-size:18px">' + esc(t.id) + '</h2><p>' + esc(t.description) + '</p>' + (t.photo ? '<div class="photos">' + t.photo.split(',').filter(u => u.indexOf('http') === 0).map(u => '<a class="ph" style="width:92px;height:92px" href="' + esc(u) + '" target="_blank"><img src="' + esc(cdn(u, 200)) + '"></a>').join('') + '</div>' : '') +
    '<label class="l">สถานะ</label><div class="row wrap" style="gap:8px">' + S.boot.master.lookups.TICKET_STATUS.map(s =>
      '<button class="seg plain ' + (e.status === s ? 'on' : '') + '" style="flex:1 1 45%" data-act="tkstatus" data-val="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div>' +
    '<label class="l">ผู้รับผิดชอบ</label><input type="text" maxlength="60" data-model="tk.edit.assignedTo" value="' + esc(e.assignedTo) + '">' +
    (e.status === 'ปิด' ? '<label class="l">บันทึกการปิดงาน</label><textarea maxlength="500" data-model="tk.edit.note">' + esc(e.note) + '</textarea>' : '') +
    '<div style="height:12px"></div><div class="grid2"><button class="btn out" data-act="mclose">ยกเลิก</button><button class="btn" data-act="tksave">บันทึก</button></div>');
}
async function saveTicket() {
  const e = S.tk.edit; if (S.busy) return; S.busy = true;
  try { await rpc('api_updateTicket', { ticketId: e.id, status: e.status, assignedTo: e.assignedTo, note: e.note }); closeModal(); toast('อัปเดต Ticket แล้ว'); await loadTickets(); refreshHome(); }
  catch (err) { toast(err.message, true); } finally { S.busy = false; }
}

/* ===== JsApp.html ===== */
/* JsApp — action router + boot */
async function refreshHome() {
  try { const r = await rpc('api_refresh'); S.boot.stats = r.stats; S.boot.recent = r.recent; if (S.view === 'home') render(); } catch (e) { /* non-fatal */ }
}
let _deb = null;
const ACT = {
  back: () => back(),
  nav: el => { S.stack = []; S.view = el.dataset.v; if (S.view === 'tickets') { S.tk.edit = null; render(true); loadTickets(); } else render(true); },
  dept: el => { S.dept = el.dataset.code; persist(); render(); },
  editname: () => promptName(),
  savename: () => { const v = $('#nameIn').value.trim(); if (!v) return toast('กรุณากรอกชื่อ', true); S.name = v.slice(0, 60); persist(); closeModal(); const f = window.__afterName; window.__afterName = null; render(); if (f) f(); },
  'mclose-bg': (el, e) => { if (e.target === el) closeModal(); },
  mclose: () => closeModal(),
  menu: el => { const k = el.dataset.k; if (k === 'inspect') { if (requireCtx()) go('inspect'); } else if (k === 'audit') startAudit(); else startReport(k); },
  startcat: el => { const c = S.boot.master.categories.find(x => x.code === el.dataset.code); if (c.mode === 'QUICK') startQuick(c); else startForm(c.formCode); },
  startform: el => startForm(el.dataset.code),
  rmphoto: el => { getPath(S, el.dataset.path).splice(Number(el.dataset.i), 1); render(); },
  sev: el => { setPath(S, el.dataset.path, el.dataset.val); render(); },
  pick: el => { const f = S.form, c = el.dataset.code; f.items[c] = f.items[c] || {}; f.items[c].result = el.dataset.val; render(); },
  hdrpick: el => { S.form.header[el.dataset.key] = el.dataset.val; render(); },
  hdrmulti: el => { const a = S.form.header[el.dataset.key] || (S.form.header[el.dataset.key] = []), v = el.dataset.val, i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); render(); },
  cause: el => { const a = S.form.header.causes, v = el.dataset.val, i = a.indexOf(v); i < 0 ? a.push(v) : a.splice(i, 1); render(); },
  pickasset: el => {
    const f = S.form, x = f.assets.items.find(i => i.uid === el.dataset.uid); if (!x) return;
    f.assetUid = x.uid; f.asset = x;
    if ((LAY(f.code).fields || []).some(d => d.key === 'location') && !f.header.location) f.header.location = x.location;
    render();
  },
  clearasset: () => { S.form.assetUid = ''; S.form.asset = null; S.form.assets = null; render(); },
  formreview: () => formReview(),
  submitform: () => submitForm(),
  quickpick: el => { S.quick.result = el.dataset.val; render(); },
  quicksubmit: () => submitQuick(),
  repreview: () => repReview(),
  repsubmit: () => submitRep(),
  auditadd: () => { if (S.audit.items.length < 20) { S.audit.items.forEach(x => x.open = false); S.audit.items.push({ severity: '', remark: '', photos: [], open: true }); render(); } },
  auditdel: (el, e) => { e.stopPropagation(); S.audit.items.splice(Number(el.dataset.i), 1); render(); },
  audittoggle: el => { const x = S.audit.items[Number(el.dataset.i)]; x.open = !x.open; render(); },
  auditreview: () => auditReview(),
  auditsubmit: () => submitAudit(),
  tkfilter: el => { S.tk.filter = el.dataset.val; render(); },
  tkopen: el => openTicket(el.dataset.id),
  tkstatus: el => { S.tk.edit.status = el.dataset.val; paintTicketSheet(); },
  tksave: () => saveTicket()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-model]'); if (!el) return;
  const p = el.dataset.model;
  if (p === 'deptQuery') { S.deptQuery = el.value; const c = $('#deptChips'); if (c) c.innerHTML = deptChips(); return; }
  setPath(S, p, el.value);
  if (p === 'form.assetQuery') { clearTimeout(_deb); _deb = setTimeout(loadAssets, 350); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function boot() {
  $('#app').innerHTML = '<div class="boot">กำลังโหลด…</div>';
  rpc('api_bootstrap').then(b => { S.boot = b; S.view = 'home'; render(true); if (!S.name) setTimeout(() => promptName(), 300); })
    .catch(e => { $('#app').innerHTML = '<div class="card" style="margin-top:40px"><h2>โหลดระบบไม่สำเร็จ</h2><div class="alert">' + esc(e.message) + '</div><button class="btn" onclick="boot()">ลองใหม่</button></div>'; });
}
boot();

  </script>
</body>
</html>
